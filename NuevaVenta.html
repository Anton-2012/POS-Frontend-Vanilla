<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar Venta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-light">


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">Cafetería</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Productos</a>
                <a class="nav-link" href="Empleado.html">Colaboradores</a>
                <a class="nav-link" href="Ventas.html">Historial ventas</a>
                <a class="nav-link active" href="#">Realizar venta</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 mb-5">
        <div class="row g-4">

            <div class="col-lg-7">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title mb-0 fw-bold text-dark"> Catálogo de Productos</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
                            <table class="table table-hover table-striped mb-0 align-middle">
                                <thead class="table-dark sticky-top">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Precio</th>
                                        <th>Stock</th>
                                        <th class="text-center">Cantidad / Agregar</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-productos">
 
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>


            <div class="col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h5 class="card-title mb-0 fw-bold">Resumen de la Venta</h5>
                    </div>
                    <div class="card-body">

                        <!-- IDENTIFICADOR DE EMPLEADO -->
                        <div class="mb-4">
                            <label for="IDempleado" class="form-label fw-bold">Colaborador que atiende:</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"></span>
                                <input id="IDempleado" type="text" class="form-control" placeholder="Ingrese ID de Empleado">
                            </div>
                        </div>

                        <hr class="my-3">


                        <div class="table-responsive mb-3" style="max-height: 250px; overflow-y: auto;">
                            <table class="table table-sm table-bordered align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Producto</th>
                                        <th>Precio</th>
                                        <th class="text-center">Cant.</th>
                                        <th>Subtotal</th>
                                        <th class="text-center">Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-detalle">
   
                                </tbody>
                            </table>
                        </div>

                        <!-- TOTAL Y BOTÓN PROCESAR -->
                        <div class="card bg-light border-0 p-3 mb-3 text-end">
                            <span class="text-muted small">Total a cobrar:</span>
                            <h2 id="total-venta" class="fw-bold text-success mb-0">Total: $0.00</h2>
                        </div>

                        <div class="d-grid">
                            <button id="btn-venta" class="btn btn-success btn-lg fw-bold" type="button">
                                Confirmar y Realizar Venta
                            </button>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="scriptNV.js"></script>
</body>

</html>
